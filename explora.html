<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#282A60">
  <meta name="description" content="Explora Rapa Nui: sitios patrimoniales, paisajes, cultura, Tāpati y turismo responsable.">
  <title>Explora Rapa Nui | Municipalidad de Rapa Nui</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>

  <style>
    :root {
      --explora-navy: #282A60;
      --explora-teal: #23A6A0;
      --explora-aqua: #DCEBE9;
      --explora-cream: #F7F6F0;
    }

    .explora-page {
      color: var(--explora-navy);
      overflow: hidden;
    }

    .explora-hero {
      min-height: 650px;
      display: flex;
      align-items: flex-end;
      position: relative;
      isolation: isolate;
      color: white;
      background: var(--explora-navy);
      padding: clamp(30px, 7vw, 90px);
    }

    .explora-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(24,26,62,.88), rgba(24,26,62,.20)),
        url("https://www.easterisland.travel/images/media/images/archaeology/easter-island-statues-ahu-tongariki-fallen-moai.jpg")
        center 55% / cover no-repeat;
    }

    .explora-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(0deg, rgba(22,24,55,.45), transparent 65%);
    }

    .explora-hero-content {
      max-width: 850px;
    }

    .explora-kicker {
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .75rem;
      font-weight: 800;
      color: #82DED5;
      margin-bottom: 16px;
    }

    .explora-hero h1 {
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: .98;
      letter-spacing: -.055em;
      max-width: 800px;
      margin: 0 0 24px;
    }

    .explora-hero p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.8;
      max-width: 660px;
      margin: 0;
    }

    .explora-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .explora-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 14px 20px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: var(--explora-teal);
      color: white;
      font-weight: 700;
      text-decoration: none;
      transition: .2s ease;
    }

    .explora-button:hover {
      background: #168983;
      color: white;
      transform: translateY(-2px);
    }

    .explora-button-light {
      background: transparent;
      color: white;
      border-color: rgba(255,255,255,.7);
    }

    .explora-button-light:hover {
      background: white;
      color: var(--explora-navy);
    }

    .explora-section {
      padding: clamp(55px, 8vw, 100px) clamp(20px, 6vw, 85px);
    }

    .explora-section-inner {
      max-width: 1240px;
      margin: 0 auto;
    }

    .explora-eyebrow {
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: .74rem;
      font-weight: 800;
      color: var(--explora-teal);
    }

    .explora-section-title,
    .explora-intro h2 {
      font-size: clamp(2rem, 4.5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.04em;
      margin: 10px 0 20px;
    }

    .explora-intro {
      display: grid;
      grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr);
      gap: 50px;
      align-items: start;
    }

    .explora-intro-copy,
    .explora-section-lead {
      line-height: 1.85;
      max-width: 760px;
    }

    .explora-stats {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .explora-stat {
      padding: 20px;
      background: var(--explora-aqua);
    }

    .explora-stat strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 7px;
    }

    .explora-stat span {
      display: block;
      font-size: .84rem;
      line-height: 1.6;
    }

    .explora-places {
      background: var(--explora-cream);
    }

    .explora-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 34px;
    }

    .explora-heading-row > div {
      max-width: 760px;
    }

    .explora-heading-row p {
      line-height: 1.8;
      max-width: 450px;
      margin-bottom: 8px;
    }

    .explora-place-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 22px;
    }

    .explora-place-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: white;
      border: 1px solid rgba(40,42,96,.12);
    }

    .explora-place-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--explora-aqua);
    }

    .explora-place-copy {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      padding: 24px;
    }

    .explora-place-number {
      color: var(--explora-teal);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .explora-place-card h3 {
      font-size: 1.35rem;
      line-height: 1.25;
      margin: 12px 0;
    }

    .explora-place-card p {
      font-size: .94rem;
      line-height: 1.8;
      margin: 0 0 22px;
    }

    .explora-text-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: auto;
      color: var(--explora-navy);
      font-size: .9rem;
      font-weight: 800;
      text-decoration: none;
      border-bottom: 2px solid var(--explora-teal);
      padding-bottom: 5px;
    }

    .explora-text-link:hover {
      color: #168983;
    }

    .explora-tapati {
      display: grid;
      grid-template-columns: minmax(0,1.05fr) minmax(0,.95fr);
      background: var(--explora-navy);
      color: white;
    }

    .explora-tapati-image {
      min-height: 480px;
      background:
        linear-gradient(0deg,rgba(24,26,62,.12),rgba(24,26,62,.12)),
        url("https://services.meteored.com/img/article/asi-ha-sido-el-inicio-de-tapati-rapa-nui-2026-el-festival-cultural-mas-potente-de-la-isla-de-pascua-1770293662094_1024.jpg")
        center / cover no-repeat;
    }

    .explora-tapati-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(30px,6vw,75px);
    }

    .explora-tapati-copy h2 {
      font-size: clamp(2.2rem,4vw,4rem);
      line-height: 1.05;
      letter-spacing: -.04em;
      margin: 12px 0 22px;
    }

    .explora-tapati-copy p {
      line-height: 1.85;
      margin: 0 0 18px;
    }

    .explora-tapati-copy .explora-text-link {
      color: white;
      margin-top: 10px;
    }

    .explora-responsible {
      background: var(--explora-aqua);
    }

    .explora-responsible-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 20px;
      margin-top: 34px;
    }

    .explora-rule {
      padding: 26px;
      background: rgba(255,255,255,.78);
      border-top: 3px solid var(--explora-teal);
    }

    .explora-rule .rule-number {
      display: block;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--explora-teal);
      margin-bottom: 18px;
    }

    .explora-rule h3 {
      font-size: 1.1rem;
      margin: 0 0 12px;
    }

    .explora-rule p {
      font-size: .93rem;
      line-height: 1.8;
      margin: 0;
    }

    .explora-visit {
      display: grid;
      grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr);
      gap: 45px;
      align-items: start;
    }

    .explora-checklist {
      list-style: none;
      margin: 24px 0;
      padding: 0;
    }

    .explora-checklist li {
      position: relative;
      padding: 15px 0 15px 30px;
      border-bottom: 1px solid rgba(40,42,96,.14);
      line-height: 1.7;
    }

    .explora-checklist li::before {
      content: "✓";
      position: absolute;
      left: 0;
      top: 15px;
      font-weight: 800;
      color: var(--explora-teal);
    }

    .explora-info-panel {
      padding: clamp(25px,4vw,42px);
      background: var(--explora-cream);
    }

    .explora-info-panel h3 {
      font-size: 1.5rem;
      margin: 0 0 15px;
    }

    .explora-info-panel p {
      line-height: 1.8;
    }

    .explora-info-panel .explora-button {
      margin: 10px 0 18px;
    }

    .explora-final-cta {
      background: var(--explora-teal);
      color: white;
      padding: clamp(35px,6vw,70px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .explora-final-cta h2 {
      font-size: clamp(1.8rem,4vw,3.2rem);
      line-height: 1.1;
      margin: 0 0 12px;
    }

    .explora-final-cta p {
      max-width: 680px;
      line-height: 1.8;
      margin: 0;
    }

    .explora-final-cta .explora-button {
      flex-shrink: 0;
      background: var(--explora-navy);
    }

    .explora-final-cta .explora-button:hover {
      background: white;
      color: var(--explora-navy);
    }

    .explora-note {
      font-size: .82rem;
      line-height: 1.7;
      opacity: .8;
      margin-top: 18px;
    }

    @media (max-width: 900px) {
      .explora-hero {
        min-height: 540px;
      }

      .explora-intro,
      .explora-tapati,
      .explora-visit {
        grid-template-columns: 1fr;
      }

      .explora-place-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }

      .explora-responsible-grid {
        grid-template-columns: 1fr;
      }

      .explora-tapati-image {
        min-height: 350px;
      }

      .explora-heading-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (max-width: 560px) {
      .explora-hero {
        min-height: 540px;
        padding: 28px 22px 42px;
      }

      .explora-hero h1 {
        font-size: clamp(2.7rem,14vw,4.5rem);
      }
